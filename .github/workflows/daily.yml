name: Daily Windfinder PDF

on:
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:

jobs:
  generate-pdf:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

     - name: Install dependencies
  run: |
    pip install playwright
    playwright install --with-deps chromium

      - name: Run script
        run: python save_pdf.py

      - name: Commit PDF
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"

          git add pdfs/

          git diff --cached --quiet || git commit -m "Add daily PDF"

          git push
